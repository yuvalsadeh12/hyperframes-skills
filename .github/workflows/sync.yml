name: Sync from upstream
on:
  schedule:
    - cron: "17 3 * * *"   # daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream skills only
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/heygen-com/hyperframes upstream
          git -C upstream sparse-checkout set skills .claude-plugin
      - name: Copy skills and bump version
        run: |
          rsync -a --delete upstream/skills/ skills/
          cp upstream/LICENSE LICENSE 2>/dev/null || true
          VER=$(jq -r .version upstream/.claude-plugin/plugin.json)
          jq --arg v "$VER" '.version = $v' .claude-plugin/plugin.json > p.json && mv p.json .claude-plugin/plugin.json
          rm -rf upstream
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Sync skills from heygen-com/hyperframes" && git push)
